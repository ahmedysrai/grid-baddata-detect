[project]
name = "gridbad"
version = "0.0.1"
description = "Bad data and false data injection detection in power system state estimation"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["scipy>=1.10"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
